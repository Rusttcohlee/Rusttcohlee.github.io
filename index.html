<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yourname</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Layout: одна колонка 720px, секции-панели с рамкой, моноширинный шрифт везде.
     Цвета меняются здесь, акцент берётся из CONFIG.accent. */
  :root {
    --bg: #0d0f12;
    --panel: #12151a;
    --line: #242a33;
    --fg: #d7dce4;
    --dim: #7c8695;
    --accent: #7fd6c2;
    --ok: #7fd6a0;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.65 var(--mono);
    padding-block: 24px 72px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-text-size-adjust: 100%;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }
  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

  .top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 16px; }
  .top .path { color: var(--dim); }
  .top .path b { color: var(--fg); font-weight: 500; }
  .nav { display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .nav a, .nav button { color: var(--dim); }
  .nav a:hover, .nav button:hover { color: var(--accent); text-decoration: none; }
  .nav button { background: none; border: 0; padding: 0; font: inherit; cursor: pointer; }
  .nav button[aria-pressed="true"] { color: var(--accent); }

  .card { border: 1px solid var(--line); background: var(--panel); padding: 16px 18px; min-width: 0; }
  .card h2 { margin: 0 0 12px; font-size: 13px; font-weight: 500; letter-spacing: .04em; color: var(--accent); }
  .card h2 span { color: var(--dim); font-weight: 400; }

  .hero { display: flex; flex-direction: column; gap: 12px; }
  .hero h1 { margin: 0; font-size: 22px; line-height: 1.2; font-weight: 700; text-wrap: balance; }
  .hero .tagline { margin: 0; color: var(--fg); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .chips li { border: 1px solid var(--line); padding: 0 8px; color: var(--dim); font-size: 12px; }
  .chips li.hot { border-color: var(--accent); color: var(--accent); }
  .clockrow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; border-top: 1px solid var(--line); padding-top: 12px; color: var(--dim); }
  .clockrow .time { color: var(--fg); font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .state { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .state.on .dot { background: var(--ok); }
  .state.on { color: var(--ok); }

  pre.art { margin: 0; overflow-x: auto; color: var(--accent); font: 10px/1.15 var(--mono); }
  .artmeta { margin: 8px 0 0; color: var(--dim); font-size: 12px; }

  .card p { margin: 0 0 12px; }
  .card p:last-child { margin-bottom: 0; }

  dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 20px; margin: 0; }
  dl.kv dt { color: var(--dim); }
  dl.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  @media (max-width: 480px) {
    dl.kv { grid-template-columns: 1fr; gap: 0; }
    dl.kv dd { margin-bottom: 8px; }
  }

  .proj { display: flex; flex-direction: column; gap: 6px; padding-block: 12px; border-top: 1px solid var(--line); }
  .proj:first-of-type { border-top: 0; padding-top: 0; }
  .proj:last-child { padding-bottom: 0; }
  .proj h3 { margin: 0; font-size: 14px; font-weight: 700; }
  .proj p { margin: 0; color: var(--fg); }

  .stack { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .stack li { border: 1px solid var(--line); padding: 2px 10px; }

  .friends { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 0; padding: 0; list-style: none; }

  .gb form { display: grid; gap: 8px; }
  .gb input, .gb textarea, .term input {
    width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--line);
    font: inherit; padding: 8px 10px; border-radius: 0;
  }
  .gb textarea { min-height: 80px; resize: vertical; }
  .btn { justify-self: start; background: none; border: 1px solid var(--accent); color: var(--accent); font: inherit; padding: 4px 14px; cursor: pointer; }
  .btn:hover { background: var(--accent); color: var(--bg); }
  .gb .status { color: var(--dim); font-size: 12px; min-height: 1.4em; }
  .gb ol { margin: 12px 0 0; padding-left: 1.4em; display: grid; gap: 8px; }
  .gb ol li small { color: var(--dim); }

  .term .out { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg); margin-bottom: 8px; }
  .term .out .cmd { color: var(--dim); }
  .term label { display: flex; align-items: center; gap: 8px; }
  .term .ps { color: var(--accent); white-space: nowrap; }
  .term input { border: 0; padding: 4px 0; background: transparent; flex: 1; min-width: 0; }

  footer { color: var(--dim); font-size: 12px; text-align: center; }

  @media (prefers-reduced-motion: no-preference) {
    .card { animation: rise .35s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============================================================
   CONFIG — всё, что нужно менять, лежит здесь.
   Текст можно писать строкой ("привет") или на двух языках
   ({ ru: "привет", en: "hi" }). Пустой массив или пустая строка
   скрывает секцию.
   ============================================================ */
const CONFIG = {
  name: "Rust Cohle",                 // заголовок, вкладка, prompt в терминале
  handle: "rusttcohlee@site",          // для команды whoami
  accent: "#7fd6c2",                // главный цвет, любой hex
  defaultLang: "ru",                // "ru" или "en"
  timezone: "Asia/Yerevan",         // IANA-пояс для часов
  birthdate: "2008-11-01T00:00:00", // для счётчика "живу уже"; пусто = без счётчика
  awakeHours: { from: 0, to: 24 },   // когда ты "не спишь" по часам выше (в 24ч формате)

  tagline: {
    ru: "я Rust, инженер по кибербезопасности",
    en: "i'm Rust, cybersecurity engineer"
  },
  tags: ["Linux", "debian", "OSINT", { text: "Opsex", hot: true }],

  /* Вставь свой ASCII-арт между обратными кавычками. Делай свой или бери
     с разрешения автора и подписывай его в artCredit. Пусто = блок скрыт. */
  ascii: `
   ┌──────────────────────┐
   │   вставь сюда арт    │
   └──────────────────────┘
`,
  artCredit: "artCredit: "ascii by Claude · osint vibes",                // например "art: Rust"

  about: [
    { ru: "OSINT расследование.", en: "OSINT investigation." },
    { ru: "сижу.", en: "I'm sitting." }
  ],

  /* Пары "ключ → значение" для блока /about. Значение можно писать со ссылкой в виде { text, url } */
  facts: [
    [{ ru: "языки", en: "languages" }, "russian, english"],
    [{ ru: "пишу код", en: "coding" }, { ru: "с 2012 года", en: "since 2012" }],
    [{ ru: "сейчас", en: "right now" }, { ru: "делаю этот сайт", en: "building this site" }]
  ],

  links: [
    { label: "telegram", text: "@yourname", url: "https://t.me/yourname" },
    { label: "github", text: "yourname", url: "https://github.com/yourname" },
    { label: "email", text: "you@example.com", url: "mailto:you@example.com" }
  ],

  projects: [
    {
      title: "project one",
      url: "https://github.com/yourname/project-one",
      desc: { ru: "Одно-два предложения о проекте.", en: "One or two sentences about the project." },
      tags: ["tag", "tag"]
    },
    {
      title: "project two",
      url: "",
      desc: { ru: "Проект без ссылки тоже работает.", en: "A project without a link works too." },
      tags: ["wip"]
    }
  ],

  stack: ["python", "typescript", "linux", "docker"],

  /* Блок "железо и софт" — те же пары ключ → значение */
  uses: [
    ["os", "arch linux"],
    ["editor", "neovim"],
    ["terminal", "kitty"],
    ["phone", "your phone"]
  ],

  friends: [
    { name: "friend one", url: "https://example.com" }
  ],

  /* Гостевая книга нужна своя серверная часть. Пока адрес пустой, блок скрыт.
     Форма шлёт POST {name, text} (JSON) на этот адрес.
     Если на GET адрес возвращает [{name, text, date}], записи покажутся ниже. */
  guestbookEndpoint: "",

  /* Свои команды для мини-терминала внизу страницы: имя → ответ */
  commands: {
    coffee: { ru: "☕ кофе закончился", en: "☕ out of coffee" }
  }
};
/* ============================ конец CONFIG ============================ */
</script>

<script>
(function () {
  "use strict";
  var C = CONFIG;
  var lang = C.defaultLang === "en" ? "en" : "ru";
  try { var saved = localStorage.getItem("lang"); if (saved === "ru" || saved === "en") lang = saved; } catch (e) {}

  var UI = {
    ru: { projects: "проекты", links: "ссылки", uses: "железо", about: "обо мне", stack: "стек", friends: "друзья",
          guestbook: "гостевая", alive: "живу уже", awake: "не сплю", asleep: "наверное сплю", name: "имя",
          message: "сообщение", send: "отправить", sent: "отправлено, появится после проверки", fail: "не получилось отправить",
          empty: "пока пусто", term: "терминал", hint: "введи help", unknown: "команда не найдена",
          me: "я", source: "исходники" },
    en: { projects: "projects", links: "links", uses: "uses", about: "about", stack: "stack", friends: "friends",
          guestbook: "guestbook", alive: "alive for", awake: "awake", asleep: "probably asleep", name: "name",
          message: "message", send: "send", sent: "sent, shows up after review", fail: "could not send",
          empty: "nothing here yet", term: "terminal", hint: "type help", unknown: "command not found",
          me: "me", source: "source" }
  };

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }
  function t(v) {
    if (v == null) return "";
    if (typeof v === "string") return v;
    if (v[lang] != null) return v[lang];
    if (v.en != null) return v.en;
    var k = Object.keys(v)[0];
    return k ? v[k] : "";
  }
  function ui(k) { return UI[lang][k]; }
  function safeUrl(u) { return /^(https?:\/\/|mailto:|\/|#)/.test(u) ? u : ""; }
  function ext(u) { return /^https?:/.test(u) ? ' target="_blank" rel="noopener noreferrer"' : ""; }
  function link(text, url) {
    var u = safeUrl(url || "");
    return u ? '<a href="' + esc(u) + '"' + ext(u) + ">" + esc(text) + "</a>" : esc(text);
  }
  function val(v) {
    if (v && typeof v === "object" && ("text" in v || "url" in v)) return link(t(v.text), v.url);
    return esc(t(v));
  }
  function kv(rows, withLinks) {
    return '<dl class="kv">' + rows.map(function (r) {
      return "<dt>" + esc(t(r[0])) + ":</dt><dd>" + (withLinks ? val(r[1]) : esc(t(r[1]))) + "</dd>";
    }).join("") + "</dl>";
  }
  function section(id, title, body) {
    return '<section class="card" id="' + id + '"><h2><span>[</span> /' + esc(title) + ' <span>]</span></h2>' + body + "</section>";
  }

  function build() {
    var h = [];
    var nav = [];
    if (C.projects.length) nav.push('<a href="#projects">[' + ui("projects") + "]</a>");
    if (C.links.length) nav.push('<a href="#links">[' + ui("links") + "]</a>");
    if (C.uses.length) nav.push('<a href="#uses">[' + ui("uses") + "]</a>");
    if (C.guestbookEndpoint) nav.push('<a href="#guestbook">[' + ui("guestbook") + "]</a>");

    h.push('<header class="top"><div class="path">~/<b>' + esc(C.name) + '</b></div><nav class="nav">' + nav.join("") +
      '<button type="button" data-lang="ru" aria-pressed="' + (lang === "ru") + '">[ru]</button>' +
      '<button type="button" data-lang="en" aria-pressed="' + (lang === "en") + '">[en]</button></nav></header>');

    var tags = C.tags.map(function (g) {
      var o = typeof g === "string" ? { text: g } : g;
      return '<li' + (o.hot ? ' class="hot"' : "") + ">" + esc(t(o.text)) + "</li>";
    }).join("");
    h.push('<section class="card hero"><h1>' + esc(C.name) + "</h1>" +
      '<p class="tagline">' + esc(t(C.tagline)) + "</p>" +
      (tags ? '<ul class="chips">' + tags + "</ul>" : "") +
      '<div class="clockrow"><span class="time" id="clock">--:--</span><span id="tz"></span><span id="date"></span>' +
      '<span class="state" id="state"><i class="dot"></i><span></span></span></div></section>');

    if (C.ascii && C.ascii.trim()) {
      h.push('<section class="card"><h2><span>[</span> /art <span>]</span></h2><pre class="art" id="art"></pre>' +
        (C.artCredit ? '<p class="artmeta">' + esc(C.artCredit) + "</p>" : "") + "</section>");
    }

    var aboutBody = C.about.map(function (p) { return "<p>" + esc(t(p)) + "</p>"; }).join("");
    var rows = C.facts.slice();
    var aliveRow = C.birthdate ? '<dl class="kv"><dt>' + esc(ui("alive")) + ':</dt><dd id="alive">…</dd></dl>' : "";
    h.push(section("about", ui("about"), aboutBody + (rows.length ? kv(rows, true) : "") + aliveRow));

    if (C.links.length) {
      h.push(section("links", ui("links"), '<dl class="kv">' + C.links.map(function (l) {
        return "<dt>" + esc(l.label) + ":</dt><dd>" + link(l.text, l.url) + "</dd>";
      }).join("") + "</dl>"));
    }

    if (C.projects.length) {
      h.push(section("projects", ui("projects"), C.projects.map(function (p) {
        var tg = (p.tags || []).map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("");
        return '<article class="proj"><h3>' + link(p.title, p.url) + (safeUrl(p.url || "") ? " ↗" : "") + "</h3><p>" + esc(t(p.desc)) + "</p>" +
          (tg ? '<ul class="chips">' + tg + "</ul>" : "") + "</article>";
      }).join("")));
    }

    if (C.stack.length) {
      h.push(section("stack", ui("stack"), '<ul class="stack">' + C.stack.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ul>"));
    }
    if (C.uses.length) h.push(section("uses", ui("uses"), kv(C.uses, false)));

    if (C.guestbookEndpoint) {
      h.push('<section class="card gb" id="guestbook"><h2><span>[</span> /' + esc(ui("guestbook")) + ' <span>]</span></h2>' +
        '<form id="gbform"><input id="gbname" maxlength="40" placeholder="' + esc(ui("name")) + '" required>' +
        '<textarea id="gbtext" maxlength="500" placeholder="' + esc(ui("message")) + '" required></textarea>' +
        '<button class="btn" type="submit">[ ' + esc(ui("send")) + ' ]</button><div class="status" id="gbstatus" role="status"></div></form>' +
        '<ol id="gblist"></ol></section>');
    }

    if (C.friends.length) {
      h.push(section("friends", ui("friends"), '<ul class="friends">' + C.friends.map(function (f) {
        return "<li>" + link(f.name, f.url) + "</li>";
      }).join("") + "</ul>"));
    }

    h.push('<section class="card term" aria-label="' + esc(ui("term")) + '"><div class="out" id="out">' + esc(ui("hint")) + '</div>' +
      '<label><span class="ps">' + esc(C.name) + '@fame:~$</span><input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="' + esc(ui("term")) + '"></label></section>');

    h.push("<footer>" + esc(C.name) + "</footer>");
    return h.join("");
  }

  var app = document.getElementById("app");

  function setLang(l) {
    lang = l;
    try { localStorage.setItem("lang", l); } catch (e) {}
    render();
  }

  function render() {
    document.documentElement.lang = lang;
    document.documentElement.style.setProperty("--accent", C.accent);
    document.title = C.name;
    app.innerHTML = build();
    var art = document.getElementById("art");
    if (art) art.textContent = C.ascii.replace(/^\n/, "").replace(/\s+$/, "");
    Array.prototype.forEach.call(app.querySelectorAll("[data-lang]"), function (b) {
      b.addEventListener("click", function () { setLang(b.getAttribute("data-lang")); });
    });
    bindTerminal();
    bindGuestbook();
    tick();
  }

  /* ---------- часы, статус, счётчик ---------- */
  function tzParts(now) {
    var f = new Intl.DateTimeFormat("en-GB", { timeZone: C.timezone, hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" });
    var p = {};
    f.formatToParts(now).forEach(function (x) { p[x.type] = x.value; });
    return p;
  }
  function tick() {
    var clock = document.getElementById("clock");
    if (!clock) return;
    var now = new Date();
    var p = tzParts(now);
    clock.textContent = p.hour + ":" + p.minute;
    var off = "";
    new Intl.DateTimeFormat("en", { timeZone: C.timezone, timeZoneName: "shortOffset" }).formatToParts(now).forEach(function (x) {
      if (x.type === "timeZoneName") off = x.value.replace("GMT", "utc").toLowerCase();
    });
    var city = C.timezone.split("/").pop().replace(/_/g, " ").toLowerCase();
    document.getElementById("tz").textContent = off + " · " + city;
    document.getElementById("date").textContent = new Intl.DateTimeFormat(lang === "ru" ? "ru-RU" : "en-GB", { timeZone: C.timezone, day: "numeric", month: "short" }).format(now);

    var hr = parseInt(p.hour, 10), a = C.awakeHours, on;
    on = a.from <= a.to ? (hr >= a.from && hr < a.to) : (hr >= a.from || hr < a.to);
    var st = document.getElementById("state");
    st.className = "state" + (on ? " on" : "");
    st.lastChild.textContent = on ? ui("awake") : ui("asleep");

    var alive = document.getElementById("alive");
    if (alive && C.birthdate) {
      var ms = now - new Date(C.birthdate);
      if (ms > 0) {
        var s = Math.floor(ms / 1000);
        var d = Math.floor(s / 86400), hh = Math.floor(s % 86400 / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60;
        var y = Math.floor(ms / 31556952000);
        alive.textContent = d + "d " + hh + "h " + String(mm).padStart(2, "0") + "m " + String(ss).padStart(2, "0") + "s (" + y + "y)";
      }
    }
  }
  setInterval(tick, 1000);

  /* ---------- мини-терминал ---------- */
  var commands = {
    help: function () { return Object.keys(commands).join("  "); },
    whoami: function () { return C.handle; },
    about: function () { return C.about.map(t).join("\n\n"); },
    links: function () { return C.links.map(function (l) { return l.label.padEnd(10) + l.text; }).join("\n"); },
    projects: function () { return C.projects.map(function (p) { return p.title + " — " + t(p.desc); }).join("\n"); },
    uses: function () { return C.uses.map(function (r) { return String(t(r[0])).padEnd(10) + t(r[1]); }).join("\n"); },
    lang: function (a) { if (a === "ru" || a === "en") { setLang(a); return null; } return "usage: lang ru|en"; },
    accent: function (a) {
      if (/^#[0-9a-f]{6}$/i.test(a || "")) { C.accent = a; document.documentElement.style.setProperty("--accent", a); return a; }
      return "usage: accent #rrggbb";
    },
    clear: function () { document.getElementById("out").textContent = ""; return null; }
  };
  Object.keys(C.commands || {}).forEach(function (k) { commands[k] = function () { return t(C.commands[k]); }; });

  function bindTerminal() {
    var input = document.getElementById("cmd"), out = document.getElementById("out");
    if (!input) return;
    input.addEventListener("keydown", function (e) {
      if (e.key !== "Enter") return;
      var raw = input.value.trim();
      input.value = "";
      if (!raw) return;
      var parts = raw.split(/\s+/), name = parts[0].toLowerCase();
      var res = commands[name] ? commands[name](parts[1]) : name + ": " + ui("unknown");
      if (name === "clear") return;
      var line = document.createElement("div");
      line.innerHTML = '<span class="cmd">$ ' + esc(raw) + "</span>";
      out.appendChild(line);
      if (res != null) { var r = document.createElement("div"); r.textContent = res; out.appendChild(r); }
    });
  }

  /* ---------- гостевая ---------- */
  function bindGuestbook() {
    var form = document.getElementById("gbform");
    if (!form) return;
    var status = document.getElementById("gbstatus"), list = document.getElementById("gblist");
    list.innerHTML = "<li><small>" + esc(ui("empty")) + "</small></li>";
    fetch(C.guestbookEndpoint).then(function (r) { return r.json(); }).then(function (rows) {
      if (!Array.isArray(rows) || !rows.length) return;
      list.innerHTML = rows.map(function (r) {
        return "<li><b>" + esc(r.name || "") + "</b> <small>" + esc(r.date || "") + "</small><br>" + esc(r.text || "") + "</li>";
      }).join("");
    }).catch(function () {});
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var body = JSON.stringify({ name: document.getElementById("gbname").value, text: document.getElementById("gbtext").value });
      fetch(C.guestbookEndpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: body })
        .then(function (r) { if (!r.ok) throw new Error(); status.textContent = ui("sent"); form.reset(); })
        .catch(function () { status.textContent = ui("fail"); });
    });
  }

  render();
})();
</script>
</body>
</html>
